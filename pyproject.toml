[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "athenai-lead-core"
version = "0.1.0"
description = "ATHENAI LEAD RECOVERY & SALES CRM CORE — вертикальный срез обработки входящих лидов"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "structlog>=24.1,<26",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*", "mock_crm*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Автогенерируемые миграции Alembic не линтим — это код инструмента, а не рукописный
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# conftest обязан переопределить DATABASE_URL до импортов приложения
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
